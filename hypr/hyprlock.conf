general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # A deep, dark brown/black to make the amber "pop"
    color = rgb(20, 15, 10) 
    blur_passes = 0
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(255, 174, 0) # Classic Amber
    font_size = 120
    font_family = JetBrains Mono Nerd Font Bold # Or any font you have installed
    position = 0, 80
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = rgb(200, 130, 0) # Slightly dimmer amber
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# INPUT FIELD (Password)
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(255, 174, 0) # Amber border
    inner_color = rgb(30, 25, 20)  # Dark inner
    font_color = rgb(255, 174, 0)
    fade_on_empty = true
    placeholder_text = <i>Type Password...</i>
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}
