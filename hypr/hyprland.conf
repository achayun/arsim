source = ~/.config/hypr/monitors.conf

# Autostart of core components
exec-once = waybar
exec-once = fcitx5 -d --replace # Keyboard layouts and Japanese IME. see: https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland
exec-once = hypridle

# Menu
$menu = hyprlauncher
bind = SUPER, R, exec, $menu

# Modifiers general assignment pattern:
# SUPER - Navigation, Focus control, move focus to workspace etc
# SUPER + SHIFT - window control (move to workspace, resize etc.)
# SUPER + CTRL - Run programs, call commands etc
# SUPER + ALT - System/session (shutdown etc)
# Exceptions - most used apps are just on SUPER; special keys like PRINT don't take modifier

# Language
bindd = SUPER, space, (CTRL+space) change language, execr, fcitx5-remote -t

# -- Quick launch Applications --
bindd = SUPER, T, 🖥️terminal, exec, kitty
bindd = SUPER, G, 🎮steam, exec, steam
bindd = SUPER, B, 🖥️browser, exec, google-chrome-stable

# -- Run programms, call commands
bindd = SUPER CTRL, P, 🔐passwords, exec, keepassxc

# Clipboard manager
# Start the clipboard daemon
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# Bind to Super+V (Standard for clipboards)
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Screenshot a region to clipboard
bindd = , PRINT, screenshot region, exec, grim -g "$(slurp)" - | wl-copy

# -- System commands --
bindd = SUPER ALT, Scroll_Lock, Lock screen, exec, hyprlock
bindd = SUPER ALT, Escape, 🔌shutdown, exec, ~/.config/hypr/scripts/shutdown_confirm.sh

# Workspaces
# --- Workspace Navigation ---
# Switch to workspace with mainMod + [1-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 9, workspace, 9
# bind = SUPER, Q, workspace, name:Q
bind = SUPER, W, workspace, name:W
bind = SUPER, E, workspace, name:E
bind = SUPER, A, workspace, name:A
bind = SUPER, S, workspace, name:S

# Move active window to a workspace with mainMod + SHIFT + [1-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, W, movetoworkspace, name:W
bind = SUPER SHIFT, E, movetoworkspace, name:E
bind = SUPER SHIFT, A, movetoworkspace, name:A
bind = SUPER SHIFT, S, movetoworkspace, name:S

# Cycle through existing workspaces
bind = SUPER, Tab, workspace, e+1
bind = SUPER SHIFT, Tab, workspace, e-1

# --- Window control ---
bindd = SUPER SHIFT, F, fullscreen window (toggle), fullscreen, 0
bindd = SUPER SHIFT, Q, close active window, killactive

# Move windows with mainMod + SHIFT + [vim-style HJKL], experiment with swapwindow if you like
bindd = SUPER SHIFT, H, move window left,  movewindow, l
bindd = SUPER SHIFT, L, move window right, movewindow, r
bindd = SUPER SHIFT, K, move window up,    movewindow, u
bindd = SUPER SHIFT, J, move window down,  movewindow, d

# Resize windows with arrows, not perfect, needs to be more intelligent
bindd = SUPER SHIFT, left,  resize window left, resizeactive, 10 0
bindd = SUPER SHIFT, right, resize window right, resizeactive, -10 0
bindd = SUPER SHIFT, up,    resize window up, resizeactive, 0 -10
bindd = SUPER SHIFT, down,  resize window down, resizeactive, 0 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# Assign apps to workspaces
windowrule {
	name = steam-ws
	match:class = ^(steam)$
	workspace = name:S
}

# Run any game in Fullscreen
windowrule {
	name = steam-game
	match:class = ^steam_app_\d+$
	fullscreen = true
	tag = +game
	idle_inhibit = true
}

# KeePassXC goes to tools workspace
windowrule {
	name = keepassxc-ws
	match:class = ^(org.keepassxc.KeePassXC)$
	float = true
	workspace = 9
}

# Skymap devenv
# Set the layout to master, not dwindle
workspace = 2, layoutopt:orientation:left, default:true
# Send the app to workspace 5 automatically
windowrule {
	name = skymap-dev-term
	match:class = ^(skymap)$
	workspace = 2
}

bindd = SUPER, D, 🌌skymap terminal, exec, kitty --class "skymap" -d ~/dev/skymap/skymap/skymap


# Keyboard/Mouse settings
input {

    follow_mouse = 1

    # This disables mouse acceleration (1:1 movement)
    accel_profile = flat
    
    # Optional: adjust sensitivity (-1.0 to 1.0)
    sensitivity = 0 

    touchpad {
        natural_scroll = false
    }
}

source = ~/.config/hypr/style.conf

source = ~/.config/hypr/windows.conf

# Floating window excpetions
windowrule = match:class fcitx, float true
windowrule {
	name = volume_control
	match:class = ^(org.pulseaudio.pavucontrol)$
	float = on
}

# Idle
misc {
    key_press_enables_dpms = true  # key press will trigger wake
    mouse_move_enables_dpms = true # mouse move will trigger wake
}

