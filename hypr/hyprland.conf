# Monitor Configuration
# Syntax: monitor = name, resolution, position, scale
monitor=,preferred,auto,1

# Add 60 pixels of dead space to the left
# monitor = name, res, offset, scale
# We use 'addreserved' to push windows away from the edge
monitor = ,addreserved, 0, 0, 20, 0 # top, bottom, left, right

# Fix the massive UI

$mainMod = SUPER

# Autostarts
exec-once = waybar

# TODO: Organize modifiers:
# $mainMod - Navigation, Focus control, move focus to workspace etc
# $mainMod + SHIFT - window control (move to workspace, resize etc.)
# $mainMod + CTRL - Run programs, call commands etc
# $mainMod + ALT - System/session (shutdown etc)
# Exceptions - most used apps are just on $mainMod
# Navigation - arrows, wasd? hjkl?

# -- Quick launch Applications --
# Steam, Game ON
bindd = $mainMod, T, launch terminal, exec, kitty
bindd = $mainMod, G, 🎮launch steam, exec, steam
bindd = $mainMod, B, launch browser, exec, google-chrome-stable

# KeePassKC, Passwords
bindd = $mainMod CTRL, P, 🔐password Manager, exec, keepassxc

# D. Launcher (The Alt+F2 equivalent)
# In Garuda, the launcher is usually 'fuzzel' or 'rofi'
bindd = $mainMod CTRL, R, ⚡quick launch, exec, wofi --show drun --width 400 --height 300 --style ~/.config/hypr/menu.css


# Clipboard manager
# Start the clipboard daemon
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# Bind to Super+V (Standard for clipboards)
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Screenshot a region to clipboard
bindd = $mainMod SHIFT, Print, screenshot region, exec, grim -g "$(slurp)" - | wl-copy

# -- System commands --
bindd = $mainMod ALT, L, Lock screen, exec, hyprlock
bindd = $mainMod ALT, Escape, 🔌shutdown, exec, ~/.config/hypr/scripts/shutdown_confirm.sh

# Workspaces
# --- Workspace Navigation ---
# Switch to workspace with mainMod + [1-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 9, workspace, 9
# bind = $mainMod, Q, workspace, name:Q
bind = $mainMod, W, workspace, name:W
bind = $mainMod, E, workspace, name:E
bind = $mainMod, R, workspace, name:R
bind = $mainMod, A, workspace, name:A
bind = $mainMod, S, workspace, name:S

# Move active window to a workspace with mainMod + SHIFT + [1-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, W, movetoworkspace, name:W
bind = $mainMod SHIFT, E, movetoworkspace, name:E
bind = $mainMod SHIFT, R, movetoworkspace, name:R
bind = $mainMod SHIFT, A, movetoworkspace, name:A
bind = $mainMod SHIFT, S, movetoworkspace, name:S

# Cycle through existing workspaces
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1

bindd = $mainMod SHIFT, F, fullscreen window (toggle), fullscreen, 0

bindd = $mainMod SHIFT, Q, close active window, killactive

# Assign apps to workspaces
windowrule {
	name = steam-ws
	match:class = ^(steam)$
	workspace = name:S
}

# KeePassXC goes to tools workspace
windowrule {
	name = keepassxc-ws
	match:class = ^(org.keepassxc.KeePassXC)$
	float = true
	workspace = 9
}

# Fullscreen apps
windowrulev2 = fullscreen, class:^steam_app_\d+$

# # Toggle the "Special" workspace
# bind = $mainMod, grave, togglespecialworkspace, magic
# # Move window to "Special" workspace
# bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Move windows with mainMod + SHIFT + [HJKL or orrows]
# Experiment with swapwindow if you like
# Vim-style (HHKB Home Row)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Arrow-style
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# If only one window lives on the desktop, absolutely no gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# Skymap devenv
# Set the layout to master, not dwindle
workspace = 2, layoutopt:orientation:left, default:true
# Send the app to workspace 5 automatically
windowrule {
	name = skymap-dev-term
	match:class = ^(skymap)$
	float = true
	move = 0 0
	size = 50% 100%
	workspace = 2
}

bind = $mainMod SHIFT, D, exec, kitty --class "skymap"

# Keyboard/Mouse settings
input {
    kb_layout = us
    follow_mouse = 1

    # This disables mouse acceleration (1:1 movement)
    accel_profile = flat
    
    # Optional: adjust sensitivity (-1.0 to 1.0)
    sensitivity = 0 
}

# Style
general {
    gaps_in = 1
    gaps_out = 1
    
    # Thinner, sharper borders
    border_size = 1 
    
    # Active window: Amber | Inactive: Darker muted amber/brown
    col.active_border = rgb(ffae00)
    col.inactive_border = rgba(594100aa)

    layout = dwindle
}

decoration {
    rounding = 0 # Sharp corners look better with thin borders
    
    # Subtle glow/shadow for the active window
    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(ffae0022) # Very faint amber glow
    }
}

group {
    col.border_active = rgb(ffae00)
    col.border_inactive = rgba(594100aa)
    groupbar {
        col.active = rgb(ffae00)
        col.inactive = rgba(594100aa)
        font_family = monospace
        font_size = 10
    }
}

animations {
    enabled = true

    # 1. Define a smoother, less aggressive curve
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # 2. Apply animations (Switch 'slide' to 'fade' for less dizziness)
    animation = windows, 1, 3, myBezier      # Windows appearing
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 3, default, fade # THIS stops the sliding motion
    animation = specialWorkspace, 1, 3, myBezier, slidevert # Slide down from top
}
